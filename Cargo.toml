[package]
name = "dory"
description = "A high-performance Rust numerical computing library for physics"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
